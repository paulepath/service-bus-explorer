<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="azureGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Bus Track lines -->
  <path d="M14 22 H50" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 32 H50" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 42 H50" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Glowing Active Bus routing path -->
  <path d="M14 22 H28 L36 32 H50" stroke="url(#azureGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M14 42 H28 L36 32" stroke="url(#azureGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Message packet nodes -->
  <!-- Left Ingress Nodes -->
  <circle cx="14" cy="22" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="14" cy="42" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Central Switch / Queue Hub -->
  <rect x="31" y="27" width="10" height="10" rx="2.5" transform="rotate(45 36 32)" fill="url(#accentGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Right Egress Node -->
  <circle cx="50" cy="32" r="4" fill="#a5f3fc" stroke="#0284c7" stroke-width="1.5" filter="url(#glow)"/>
</svg>
